
rules:
  - id: codeshield.java.hardcoded-password
    languages:
      - java
    severity: WARNING
    message: >-
      Potential hardcoded password detected.
      Avoid storing credentials directly in source code.
    patterns:
      - pattern: String $VAR = "...";
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|passwd|pwd|secret).*
