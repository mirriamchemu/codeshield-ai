
rules:
  - id: codeshield.java.sql-injection-concatenation
    languages:
      - java
    severity: ERROR
    message: >-
      Potential SQL injection vulnerability detected.
      Avoid constructing SQL queries through string
      concatenation. Use PreparedStatement with
      parameterized queries instead.
    patterns:
      - pattern-either:
          - pattern: |
              $QUERY = $LEFT + $RIGHT;
              ...
              $STMT.executeQuery($QUERY);
          - pattern: |
              $QUERY = $LEFT + $RIGHT;
              ...
              $STMT.executeUpdate($QUERY);
          - pattern: |
              $STMT.executeQuery($LEFT + $RIGHT);
          - pattern: |
              $STMT.executeUpdate($LEFT + $RIGHT);
